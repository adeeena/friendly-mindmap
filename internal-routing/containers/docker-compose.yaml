name: internal-routing

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - routing
    restart: unless-stopped

networks:
  routing:
    external: true
    name: containers_routing

volumes:
  caddy-data: {}
  caddy-config: {}
