# Application origin: static Angular shell + same-origin API proxy.
# TLS is terminated by a reverse proxy in front of this container; it should set
# X-Forwarded-Proto and X-Forwarded-For. APP_ORIGIN is enforced by the API.

# Honour a TLS terminator's X-Forwarded-Proto, otherwise use the local scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Caddy supplies the client address; direct local development falls back to the socket peer.
map $http_x_forwarded_for $forwarded_for {
    default $http_x_forwarded_for;
    ""      $remote_addr;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Docker's embedded DNS; the variable upstream below is re-resolved so an
    # API container recreated with a new address is followed without reloading nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3000;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # JSON API: modest body limit (the API accepts at most 2 MiB JSON), never cached.
    location /api/ {
        client_max_body_size 3m;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        error_page 502 503 504 = @api_unavailable;
    }

    # Streamed attachment upload parts. Request bodies go straight to the API without
    # temp-file or memory buffering. nginx imposes no size cap (client_max_body_size 0):
    # the API enforces exact part sizes and the basic-user policy; admin parts may be
    # as large as the S3 provider allows (up to 5 GiB).
    location ~ ^/api/boards/[^/]+/uploads/[^/]+/parts/[0-9]+$ {
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_cache off;
        client_body_timeout 1h;
        proxy_connect_timeout 5s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        send_timeout 1h;
        error_page 502 503 504 = @api_unavailable;
    }

    # Streamed attachment downloads (no response buffering or caching).
    location ~ ^/api/boards/[^/]+/attachments/[^/]+$ {
        proxy_buffering off;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 1h;
        send_timeout 1h;
        error_page 502 503 504 = @api_unavailable;
    }

    location @api_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 503 '{"error":{"code":"DEPENDENCY_UNAVAILABLE","message":"The API is unavailable.","requestId":"proxy"}}';
    }

    # Service-worker control files must always be revalidated or updates never arrive.
    location = /ngsw.json {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~ ^/(ngsw-worker|safety-worker|worker-basic\.min)\.js$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Content-hashed Angular bundles never change.
    location ~ ^/(main|polyfills|styles|chunk)-[A-Za-z0-9]+\.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback; the shell is revalidated so a new deployment is picked up.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
